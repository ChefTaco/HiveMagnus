name: Site

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Daily, to catch links that broke and Hive releases the site does not describe yet.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check guide index, internal links, JSON-LD hash and shell syntax
        run: npm run check
      - name: Version facts match the signed manifest of the reviewed release
        run: npm run check:versions -- --manifest
      - name: The reviewed release is the latest published Hive release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:versions -- --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Browser check
        run: npm run check:browser
      - name: External links
        run: npm run check:links
        env:
          GITHUB_TOKEN: ${{ github.token }}
